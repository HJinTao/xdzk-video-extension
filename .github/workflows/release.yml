name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      force:
        description: "Re-upload assets if the current version release already exists"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and verify
        run: |
          npm ci --ignore-scripts
          npm run check
          npm test

      - name: Resolve version and release decision
        id: meta
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          MANIFEST_VERSION="$(node -p "require('./extension/manifest.json').version")"
          if [ "$VERSION" != "$MANIFEST_VERSION" ]; then
            echo "Version mismatch: package.json=$VERSION, manifest.json=$MANIFEST_VERSION" >&2
            exit 1
          fi
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            REF_TAG="${GITHUB_REF#refs/tags/}"
            if [ "$REF_TAG" != "$TAG" ]; then
              echo "Tag ${REF_TAG} does not match package version ${TAG}" >&2
              exit 1
            fi
          fi

          TAG_EXISTS="false"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            TAG_EXISTS="true"
          fi
          echo "tag_exists=${TAG_EXISTS}" >> "$GITHUB_OUTPUT"

          RELEASE_EXISTS="false"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            RELEASE_EXISTS="true"
          fi
          echo "release_exists=${RELEASE_EXISTS}" >> "$GITHUB_OUTPUT"

          SHOULD_RELEASE="false"
          if [ "${RELEASE_EXISTS}" = "false" ]; then
            SHOULD_RELEASE="true"
          elif [ "${{ inputs.force }}" = "true" ]; then
            SHOULD_RELEASE="true"
          fi
          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build release archive and Chinese release notes
        if: steps.meta.outputs.should_release == 'true'
        run: |
          npm run build
          node scripts/release-notes.mjs --out dist/release-notes.md

      - name: Publish GitHub Release
        if: steps.meta.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_EXISTS: ${{ steps.meta.outputs.release_exists }}
        run: |
          ZIP="dist/xdzk-recorder-${VERSION}.zip"
          SHA="${ZIP}.sha256"
          LATEST="dist/xdzk-recorder-latest.zip"
          if [ "$RELEASE_EXISTS" = "true" ]; then
            gh release edit "$TAG" --title "$TAG" --notes-file dist/release-notes.md
            gh release upload "$TAG" "$ZIP" "$SHA" "$LATEST" --clobber
          else
            gh release create "$TAG" "$ZIP" "$SHA" "$LATEST" \
              --target "$GITHUB_SHA" \
              --title "$TAG" \
              --notes-file dist/release-notes.md
          fi
