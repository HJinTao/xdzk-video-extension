name: XDZK
options:
  deploymentTarget:
    iOS: "16.4"
  preGenCommand: |
    if [ -f ../../scripts/prepare-native.mjs ]; then
      node ../../scripts/prepare-native.mjs Resources
    else
      test -s Resources/reader.js
    fi
settings:
  base:
    XDZK_APP_ID: io.github.pais1ey.xdzk
    MARKETING_VERSION: 0.6.0
    CURRENT_PROJECT_VERSION: 600
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
targets:
  XDZK:
    type: application
    platform: iOS
    sources:
      - App
      - path: Shared.swift
      - path: Resources
        type: folder
        buildPhase: resources
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: 智课看课
        UILaunchScreen: {}
        XDZKGroup: group.$(XDZK_APP_ID)
        NSAppTransportSecurity:
          NSExceptionDomains:
            newes.chaoxing.com:
              NSExceptionAllowsInsecureHTTPLoads: true
            kdlbptvideo.xidian.edu.cn:
              NSExceptionAllowsInsecureHTTPLoads: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(XDZK_APP_ID)
        CODE_SIGN_ENTITLEMENTS: ShareGroup.entitlements
    dependencies:
      - target: ShareCourse
        embed: true
  ShareCourse:
    type: app-extension
    platform: iOS
    sources: [Share, Shared.swift]
    info:
      path: Generated/Share-Info.plist
      properties:
        CFBundleDisplayName: 智课看课
        XDZKGroup: group.$(XDZK_APP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.share-services
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ShareController
          NSExtensionAttributes:
            NSExtensionActivationRule:
              NSExtensionActivationSupportsWebURLWithMaxCount: 1
              NSExtensionActivationSupportsText: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(XDZK_APP_ID).share
        CODE_SIGN_ENTITLEMENTS: ShareGroup.entitlements
