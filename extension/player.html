<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>专注看课 · 西电智课</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="player.css">
  <link rel="stylesheet" href="subtitles.css">
  <link rel="stylesheet" href="playback.css">
  <script type="module" src="player.js"></script>
</head>
<body>
  <main>
    <header class="page-head">
      <div class="course-heading">
        <p class="brand"><img src="icons/icon32.png" width="24" height="24" alt="">西电智课 <span aria-hidden="true">/</span> 课程回放</p>
        <h1 id="course-title">正在载入课程…</h1>
      </div>
      <div class="view-actions">
        <a href="mobile.html" id="mobile-home" hidden>观看记录</a>
        <button id="mobile-single" type="button" hidden>只看主画面</button>
        <button id="swap-views" type="button" disabled><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M3 8h17m-4-4 4 4-4 4M21 16H4m4-4-4 4 4 4"/></svg>交换主副画面</button>
        <button id="toggle-review" type="button" aria-expanded="false" aria-controls="review" disabled><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M14 5v14m-8-5h5m6-5h1m-1 4h1"/></svg>字幕复习</button>
      </div>
    </header>
    <p id="message" role="status" hidden></p>
    <div class="study-layout">
      <div class="watch-column">
        <section class="screens" aria-label="专注看课" data-primary="0">
          <figure id="screen-0">
            <div class="lecture-player" role="group" aria-label="画面 1 播放器"><video id="video-0" playsinline preload="metadata"></video></div>
            <figcaption><strong id="screen-name-0">画面 1</strong><span id="screen-role-0">主画面</span></figcaption>
          </figure>
          <figure id="screen-1">
            <div class="lecture-player" role="group" aria-label="画面 2 播放器"><video id="video-1" playsinline preload="metadata" muted></video></div>
            <figcaption><strong id="screen-name-1">画面 2</strong><span id="screen-role-1">副画面</span></figcaption>
          </figure>
        </section>
        <section class="controls" aria-label="同步播放控制">
          <div class="timeline">
            <span id="current">00:00</span><input id="timeline" type="range" min="0" max="1" value="0" step="0.1" aria-label="共同播放进度" disabled><span id="duration">--:--</span>
          </div>
          <div class="control-row">
            <button type="button" id="play" class="primary" disabled>播放</button>
            <button type="button" id="back" aria-label="后退 10 秒" disabled>−10 秒</button>
            <button type="button" id="forward" aria-label="前进 10 秒" disabled>+10 秒</button>
            <span id="sync-status" role="status">等待两路视频就绪</span>
          </div>
          <div class="play-options">
            <fieldset><legend>声音</legend>
              <label><input type="radio" name="audio" value="0" checked><span id="audio-name-0">画面 1</span></label>
              <label><input type="radio" name="audio" value="1"><span id="audio-name-1">画面 2</span></label>
              <label><input type="radio" name="audio" value="-1">静音</label>
            </fieldset>
            <div id="speed-control" class="speed-control" data-select-id="rate"></div>
            <button id="toggle-captions" type="button" aria-label="双路字幕" aria-pressed="true" disabled>双路字幕 <span id="caption-state">读取中</span></button>
          </div>
          <p id="caption-hint" hidden>暂无可用字幕，可在「字幕复习」中导入 SRT 或 VTT。</p>
        </section>
        <details class="source-settings">
          <summary>视频源与时间校准</summary>
          <div class="settings-grid">
            <label>画面 1 视频源<select id="source-0"></select></label>
            <label>画面 2 视频源<select id="source-1"></select></label>
            <label>画面 2 时间偏移（秒）<input id="offset" type="number" value="0" step="0.1" min="-86400" max="86400" aria-describedby="offset-help"></label>
            <button id="refresh" type="button">更新视频源</button>
          </div>
          <p id="offset-help">正数表示画面 2 播放到更靠后的位置。链接失效时，请先刷新原回放页面并重新识别。</p>
        </details>
      </div>
      <aside id="review" aria-labelledby="review-heading" hidden>
        <header class="review-head"><h2 id="review-heading">字幕复习</h2><button type="button" id="close-review" aria-label="收起字幕复习"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
        <label class="review-source">复习画面<select id="review-source"><option value="0">画面 1</option><option value="1">画面 2</option></select></label>
        <div data-track-panel="0"><div id="subtitles-0" class="subtitles" role="group" aria-label="画面 1 字幕" hidden></div></div>
        <div data-track-panel="1" hidden><div id="subtitles-1" class="subtitles" role="group" aria-label="画面 2 字幕" hidden></div></div>
        <p id="shared-caption-note" hidden></p>
        <div class="transcript-tools" hidden>
          <label for="cue-search">搜索字幕</label>
          <input id="cue-search" type="search" autocomplete="off" placeholder="输入关键词或时间">
          <div class="cue-summary"><span id="cue-count" role="status"></span><label><input id="cue-follow" type="checkbox" checked>跟随播放</label></div>
        </div>
        <p id="cue-empty">选择课程字幕，或导入 SRT / VTT 文件。</p>
        <ol id="cue-list" aria-label="字幕时间和内容" hidden></ol>
      </aside>
    </div>
  </main>
</body>
</html>
