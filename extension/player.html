<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>专注看课 · 西电智课</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="player.css">
  <link rel="stylesheet" href="subtitles.css">
  <link rel="stylesheet" href="playback.css">
  <script type="module" src="player.js"></script>
</head>
<body>
  <main>
    <header class="page-head">
      <div class="course-heading">
        <div class="title-row">
          <img class="brand-mark" src="icons/icon32.png" width="24" height="24" alt="西电智课">
          <h1 id="course-title">正在载入课程…</h1>
        </div>
        <p id="lesson-subtitle" class="lesson-subtitle" hidden></p>
      </div>
      <div class="view-actions">
        <button id="toggle-playlist" type="button" aria-expanded="false" aria-controls="playlist-panel" hidden>
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span>课程目录</span>
          <span id="playlist-badge" class="badge"></span>
        </button>
        <button id="swap-views" type="button" disabled>
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M3 8h17m-4-4 4 4-4 4M21 16H4m4-4-4 4 4 4"/></svg>
          <span>交换主副画面</span>
        </button>
        <button id="toggle-review" type="button" aria-expanded="false" aria-controls="review" disabled>
          <svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M14 5v14m-8-5h5m6-5h1m-1 4h1"/></svg>
          <span>字幕复习</span>
        </button>
      </div>
    </header>
    <div id="message" class="message-bar" role="status" hidden>
      <span id="message-text"></span>
      <span id="message-actions" class="message-actions" hidden></span>
    </div>
    <div class="study-layout">
      <div class="watch-column">
        <section class="screens" aria-label="专注看课" data-primary="0">
          <figure id="screen-0">
            <div class="lecture-player" role="group" aria-label="画面 1 播放器"><video id="video-0" playsinline preload="metadata"></video></div>
            <figcaption><strong id="screen-name-0">画面 1</strong><span id="screen-role-0" class="role-tag">主画面</span></figcaption>
          </figure>
          <figure id="screen-1">
            <div class="lecture-player" role="group" aria-label="画面 2 播放器"><video id="video-1" playsinline preload="metadata" muted></video></div>
            <figcaption><strong id="screen-name-1">画面 2</strong><span id="screen-role-1" class="role-tag">副画面</span></figcaption>
          </figure>
        </section>
        <div id="next-countdown" class="next-countdown" role="status" aria-live="polite" hidden>
          <span id="next-countdown-text"></span>
          <div class="next-countdown-actions">
            <button type="button" id="play-next-now" class="primary">立即播放</button>
            <button type="button" id="cancel-next">取消</button>
          </div>
        </div>
        <section class="controls" aria-label="同步播放控制">
          <div class="timeline">
            <span id="current">00:00</span><input id="timeline" type="range" min="0" max="1" value="0" step="0.1" aria-label="共同播放进度" disabled><span id="duration">--:--</span>
          </div>
          <div class="control-row">
            <div class="transport-group">
              <button type="button" id="prev-lesson" title="上一节" hidden disabled><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M6 6v12M18 6l-8 6 8 6V6z"/></svg><span>上一节</span></button>
              <button type="button" id="back" aria-label="后退 10 秒" disabled>−10 秒</button>
              <button type="button" id="play" class="primary" disabled>播放</button>
              <button type="button" id="forward" aria-label="前进 10 秒" disabled>+10 秒</button>
              <button type="button" id="next-lesson" title="下一节" hidden disabled><span>下一节</span><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M18 6v12M6 6l8 6-8 6V6z"/></svg></button>
            </div>
            <span id="sync-status" class="sync-status" role="status" data-state="idle">等待两路视频就绪</span>
          </div>
          <div class="play-options">
            <fieldset class="audio-group"><legend>声音</legend>
              <div class="segmented-radios">
                <label><input type="radio" name="audio" value="0" checked><span id="audio-name-0">画面 1</span></label>
                <label><input type="radio" name="audio" value="1"><span id="audio-name-1">画面 2</span></label>
                <label><input type="radio" name="audio" value="-1"><span>静音</span></label>
              </div>
            </fieldset>
            <div id="speed-control" class="speed-control" data-select-id="rate"></div>
            <div class="option-toggles">
              <button id="toggle-captions" type="button" aria-label="双路字幕" aria-pressed="true" disabled>双路字幕 <span id="caption-state">读取中</span></button>
              <label id="auto-next-wrap" class="auto-next-option" hidden><input id="auto-next" type="checkbox" checked><span>自动连播</span></label>
            </div>
          </div>
          <p id="caption-hint" hidden>暂无可用字幕，可在「字幕复习」中导入 SRT 或 VTT。</p>
        </section>
        <div class="player-foot">
          <details class="source-settings">
            <summary>视频源与时间校准</summary>
            <div class="settings-grid">
              <label>画面 1 视频源<select id="source-0"></select></label>
              <label>画面 2 视频源<select id="source-1"></select></label>
              <label>画面 2 时间偏移（秒）<input id="offset" type="number" value="0" step="0.1" min="-86400" max="86400" aria-describedby="offset-help"></label>
              <button id="refresh" type="button">更新视频源</button>
            </div>
            <p id="offset-help">正数表示画面 2 播放到更靠后的位置。链接失效时，请先刷新原回放页面并重新识别。</p>
          </details>
          <p class="shortcut-hint" aria-label="键盘快捷键提示">快捷键：空格 播放/暂停 · ← / → 跳转 5 秒 · Shift+方向键 10 秒</p>
        </div>
      </div>
      <aside id="playlist-panel" class="side-panel" aria-labelledby="playlist-heading" hidden>
        <header class="side-head">
          <div class="side-tabs" role="tablist" aria-label="侧栏切换">
            <h2 id="playlist-heading" class="side-tab active">课程目录</h2>
            <button type="button" class="side-tab side-tab-review">字幕复习</button>
          </div>
          <div class="playlist-head-actions">
            <button type="button" id="refresh-playlist" class="icon-button" aria-label="刷新课程目录" title="刷新课程目录"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="M20 12a8 8 0 1 1-2.3-5.6L20 9m0-5v5h-5"/></svg></button>
            <button type="button" id="close-playlist" class="icon-button" aria-label="收起课程目录" title="收起课程目录"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
          </div>
        </header>
        <div class="playlist-overview">
          <div class="playlist-overview-row">
            <span id="playlist-summary" class="playlist-summary"></span>
            <button type="button" id="playlist-locate" class="quiet-btn">定位当前</button>
          </div>
          <div class="playlist-overall-track" aria-hidden="true"><span id="playlist-overall-fill"></span></div>
        </div>
        <div class="playlist-tools">
          <select id="playlist-filter" aria-label="筛选课次">
            <option value="all">全部课次</option>
            <option value="unwatched">未看完</option>
            <option value="watched">已看完</option>
          </select>
        </div>
        <p id="playlist-status" class="playlist-status" hidden></p>
        <ol id="playlist-list" class="playlist-list" aria-label="同课程课次列表"></ol>
      </aside>
      <aside id="review" class="side-panel" aria-labelledby="review-heading" hidden>
        <header class="side-head">
          <div class="side-tabs" role="tablist" aria-label="侧栏切换">
            <button type="button" class="side-tab side-tab-playlist" hidden>课程目录</button>
            <h2 id="review-heading" class="side-tab active">字幕复习</h2>
          </div>
          <button type="button" id="close-review" class="icon-button" aria-label="收起字幕复习" title="收起字幕复习"><svg viewBox="0 0 24 24" class="icon" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
        </header>
        <label class="review-source">复习画面<select id="review-source"><option value="0">画面 1</option><option value="1">画面 2</option></select></label>
        <div data-track-panel="0"><div id="subtitles-0" class="subtitles" role="group" aria-label="画面 1 字幕" hidden></div></div>
        <div data-track-panel="1" hidden><div id="subtitles-1" class="subtitles" role="group" aria-label="画面 2 字幕" hidden></div></div>
        <p id="shared-caption-note" hidden></p>
        <div class="transcript-tools" hidden>
          <label for="cue-search">搜索字幕</label>
          <input id="cue-search" type="search" autocomplete="off" placeholder="输入关键词或时间">
          <div class="cue-summary"><span id="cue-count" role="status"></span><label><input id="cue-follow" type="checkbox" checked>跟随播放</label></div>
        </div>
        <p id="cue-empty">选择课程字幕，或导入 SRT / VTT 文件。</p>
        <ol id="cue-list" aria-label="字幕时间和内容" hidden></ol>
      </aside>
    </div>
  </main>
</body>
</html>
