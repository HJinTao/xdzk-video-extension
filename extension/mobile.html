<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>手机看课 · 西电智课</title>
  <link rel="stylesheet" href="theme.css"><link rel="stylesheet" href="history.css"><link rel="stylesheet" href="playback.css"><link rel="stylesheet" href="subtitles.css"><link rel="stylesheet" href="mobile.css">
  <script type="module" src="mobile.js"></script>
</head>
<body><main>
  <header><img src="icons/icon32.png" alt="" width="28" height="28"><h1>西电智课 · 手机看课</h1></header>
  <p id="status" role="status" hidden></p>
  <section id="app-course" class="panel" hidden>
    <h2>打开智课回放</h2>
    <form id="course-form">
      <label for="course-link">课程播放网址</label><input id="course-link" type="url" required inputmode="url" autocapitalize="off" spellcheck="false" placeholder="粘贴从 Chrome 或必应复制的智课链接">
      <button class="primary" type="submit">打开课程</button>
    </form>
  </section>
  <section id="single" class="panel" hidden>
    <h2 id="single-title"></h2>
    <div class="lecture-player"><video id="single-video" playsinline preload="metadata"></video></div>
    <div id="single-speed" class="speed-control"></div><div id="single-captions" class="subtitles"></div>
  </section>
  <section id="current-lesson" class="panel" hidden>
    <h2 id="current-title">本次录播</h2>
    <div id="camera-links" class="camera-links"></div>
    <p>想保存视频时，打开对应画面的原片，再使用浏览器的视频菜单。</p>
  </section>
  <section id="browser-import" class="panel">
    <h2>打开课程</h2>
    <p>电脑插件生成的手机链接可以直接打开。也可以在这里粘贴学校的 MP4 地址，每行一路。</p>
    <form id="import-form">
      <label for="links">录播链接</label><textarea id="links" rows="3" required autocapitalize="off" spellcheck="false"></textarea>
      <label for="title">课程名称（选填）</label><input id="title" maxlength="60">
      <button type="submit" class="primary">打开录播</button>
    </form>
    <details><summary>直接从手机上的智课回放打开</summary>
      <p>收藏本页，将书签命名为「智课看课」。编辑书签，把网址替换为下方代码。然后在同一浏览器登录智课，打开本节回放，点播放后运行该书签。</p>
      <p>手机 Chrome 可以在地址栏输入书签名，再点带书签图标的匹配项。若必应内置浏览页限制脚本书签，可直接打开电脑插件生成的手机链接。</p>
      <label for="bookmark">书签代码</label><textarea id="bookmark" readonly rows="2" spellcheck="false"></textarea>
      <button id="copy-bookmark" type="button">复制书签代码</button>
    </details>
  </section>
  <section class="history-panel"><h2>观看记录</h2><p>进度保存在本机。重新打开同一课次即可续播。</p><ul class="watch-list" id="watch-list"></ul></section>
</main></body>
</html>
